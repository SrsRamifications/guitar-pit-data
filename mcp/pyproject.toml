[project]
name = "guitar-pit-mcp"
version = "0.1.0"
description = "Read-only MCP server for The Guitar Pit used-guitar market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "duckdb>=1.1",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
guitar-pit-mcp = "guitar_pit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_pit_mcp"]
